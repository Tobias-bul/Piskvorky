name: Build APK + Web
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.web.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o "$(ls *.zip | head -1)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: piskvorky/app/src/main/assets
      - id: web
        uses: actions/deploy-pages@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p piskvorky assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: piskvorky/app/build/outputs/apk/debug/app-debug.apk
